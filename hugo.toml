baseURL = "https://520236.xyz/"
languageCode = "zh-CN"
title = "Ilyfalt 的博客"
theme = "PaperMod"

[pagination]
  pagerSize = 10

enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true

[params]
  env = "production"
  title = "Ilyfalt 的博客"
  description = "Ilyfalt 的个人博客"
  keywords = [ "Blog", "Portfolio" ]
  author = "Ilyfalt"
  images = [ "/img/avatar.png" ]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  enableEmoji = true
  enableGoogleAnalytics = false

  [params.homeInfoParams]
    Title = "你好，我是 Ilyfalt"
    Content = "欢迎来到我的博客，这里记录技术笔记和折腾心得。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Ilyfalt/"

  [params.assets]
    disableHLJS = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]